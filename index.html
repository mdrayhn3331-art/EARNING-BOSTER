<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Earning Booster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="backdrop">
  <canvas id="backdrop-canvas"></canvas>
  <div class="grain"></div>
</div>

<div class="login-shell">

  <aside class="login-aside">
    <div class="brandmark">
      <div class="coin">₿</div>
      <span class="brand-name">Earning Booster</span>
    </div>

    <div class="aside-quote">
      <h2>Small tasks, <em>steady payouts.</em></h2>
      <div class="aside-stats">
        <div>
          <strong>$2.4M+</strong>
          <span>paid out to members</span>
        </div>
        <div>
          <strong>180k</strong>
          <span>active earners</span>
        </div>
        <div>
          <strong>4.8/5</strong>
          <span>average rating</span>
        </div>
      </div>
    </div>

    <p class="aside-foot">© 2026 Earning Booster. Payouts processed daily.</p>
  </aside>

  <main class="login-main">
    <div class="login-card">
      <h1>Welcome back</h1>
      <p class="sub">Sign in to check today's earnings and cash out.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>

        <div class="row-between">
          <label style="display:flex;align-items:center;gap:.5em;">
            <input type="checkbox" style="width:auto;" /> Keep me signed in
          </label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn3d block">Sign in</button>
      </form>

      <div class="divider">or continue with</div>
      <button type="button" class="btn3d ghost block">Continue with Google</button>

      <p class="signup-line">New here? <a href="home.html">Create a free account →</a></p>
    </div>
  </main>

</div>

<script src="backdrop.js"></script>
<script>
  document.getElementById("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    window.location.href = "home.html";
  });
</script>
</body>
</html>
